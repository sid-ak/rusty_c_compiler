site_name: Rusty C Compiler
site_description: A compiler for a subset of C, written in Rust, targeting ARM64 macOS.
site_author: Sidharth Anandkumar
site_url: https://sid-ak.github.io/rusty_c_compiler/
repo_url: https://github.com/sid-ak/rusty_c_compiler
repo_name: sid-ak/rusty_c_compiler
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# dive-deep/ holds fragments embedded into architecture.md via pymdownx.snippets, not standalone
# pages — their links are written to resolve from architecture.md's location, so they must never be
# built as pages of their own.
plugins:
  - search
  - exclude:
      glob:
        - dive-deep/*

# docs/api/ is the rustdoc output staged by scripts/build-docs.sh — generated content, not authored
# pages, so none of it belongs in the nav. Declaring that here rather than loosening
# validation.omitted_files keeps the "a new page must be in the nav" rule strict for real pages.
# It is a glob rather than one filename because rustdoc ships a markdown licence file with its
# bundled font, and a future version may ship others.
#
# reports/unit_tests/**/evidence_*.md is the same kind of generated content: raw `cargo test`
# output regenerated by scripts/test-evidence.sh, linked from the report(s) beside or near it
# rather than navigated to on its own. evidence_all.md sits directly under unit_tests/ (the
# whole-suite cross-check isn't any single unit's evidence), the rest one level down beside the
# unit they belong to — `**` covers both.
not_in_nav: |
  api/**
  reports/unit_tests/**/evidence_*.md

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Explanations:
      - Overview: explanations/index.md
      - Phase 1 — Foundation, diagnostics, and the lexer: explanations/Phase-1-Explanation.md
      - Phase 2 — The AST and the parser: explanations/Phase-2-Explanation.md
      - Phase 3 — Semantic analysis: explanations/Phase-3-Explanation.md
      - Phase 4 — Code generation and the driver: explanations/Phase-4-Explanation.md
      - Phase 5 — Differential testing, fuzzing, and acceptance: explanations/Phase-5-Explanation.md
  - Reports:
      - Acceptance: reports/acceptance.md
      - Unit Tests:
          - Overview: reports/unit_tests/index.md
          - 00 — Environment: reports/unit_tests/00-environment/00-environment.md
          - 01 — Diagnostics: reports/unit_tests/01-diagnostics/01-diagnostics.md
          - 02 — The Syntax Tree: reports/unit_tests/02-ast/02-ast.md
          - "03 — Lexer: The Token Model": reports/unit_tests/03-lexer-token-model/03-lexer-token-model.md
          - "04 — Lexer: The Scanner": reports/unit_tests/04-lexer-scanner/04-lexer-scanner.md
          - "05 — Parser: Expressions": reports/unit_tests/05-parser-expressions/05-parser-expressions.md
          - "06 — Parser: Statements and Recovery": reports/unit_tests/06-parser-statements-recovery/06-parser-statements-recovery.md
          - "07 — Sema: The Type Model": reports/unit_tests/07-sema-type-model/07-sema-type-model.md
          - "08 — Sema: The Scope Stack": reports/unit_tests/08-sema-scopes/08-sema-scopes.md
          - "09 — Sema: The Analyzer": reports/unit_tests/09-sema-analyzer/09-sema-analyzer.md
          - "10 — Codegen: The Emitter": reports/unit_tests/10-codegen-emitter/10-codegen-emitter.md
          - "11 — Codegen: Frames and Lowering": reports/unit_tests/11-codegen-frame-and-lowering/11-codegen-frame-and-lowering.md
          - 12 — The Driver and the Command Line: reports/unit_tests/12-driver-and-cli/12-driver-and-cli.md
          - 13 — The Runtime Shim: reports/unit_tests/13-runtime-shim/13-runtime-shim.md
          - 14 — The Differential Harness: reports/unit_tests/14-differential-harness.md
  - Cheatsheet: CHEATSHEET.md
  - API Reference: api.md
  - Pragmatic Testing: PRAGMATIC_TESTING.md
  - Implementation Plan: PLAN.md
  - Decisions:
      - Overview: decisions/index.md
      - 0001 — Subset of C, clang as oracle: decisions/0001-subset-of-c-with-clang-as-oracle.md
      - 0002 — Rust as implementation language: decisions/0002-rust-as-implementation-language.md
      - 0003 — Single target, ARM64 macOS: decisions/0003-single-target-arm64-macos.md
      - 0004 — Immutable AST, side-table annotations: decisions/0004-immutable-ast-with-side-table-annotations.md
      - 0005 — Stack spilling, not register allocation: decisions/0005-stack-spilling-instead-of-register-allocation.md
      - 0006 — Fixed-arity runtime shim: decisions/0006-fixed-arity-runtime-shim.md
      - 0007 — Array decay at the parameter boundary: decisions/0007-array-decay-only-at-parameter-boundary.md
      - 0008 — Reject undefined behavior: decisions/0008-reject-undefined-behavior.md
      - 0009 — clang as assembler and linker: decisions/0009-clang-as-assembler-and-linker.md
      - 0010 — Constraint violations are errors: decisions/0010-constraint-violations-are-errors.md
  - Proposal: PROPOSAL.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

# A broken internal link or a page missing from the nav fails the build.
strict: true
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
