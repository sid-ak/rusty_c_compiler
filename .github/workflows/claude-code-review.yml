name: Claude Code Review

# Reviews a pull request when it opens, and each push to it afterwards. The first review covers
# the whole pull request; each later review covers only the commits since the last review that
# reported, so a fix-up commit is not answered with a second pass over files already reviewed. Every
# run posts a report — findings or an explicit "no issues" — and the job fails if it does not, so a
# silent run shows up as a red check rather than a green one that explains nothing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push supersedes a review still running for an older one. Nothing is lost by cancelling:
# a review's range starts at the last commit a posted report covered, not at the push that
# triggered it, so the surviving run takes in every commit the cancelled one would have.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A draft is not ready for review; `ready_for_review` reviews it once it is.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, so the last reviewed commit and the merge base can be resolved.
          fetch-depth: 0

      # The range starts where the last posted report left off rather than at the push's previous
      # head: GitHub replaces a pending run in a concurrency group with a newer one, and a run can
      # fail or be cancelled, and in each case that run's commits must fall to the next review. Only
      # bot comments count, so a marker pasted into a human comment cannot move the range.
      - name: Find the last reviewed commit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.type == "Bot") | .body | capture("^<!-- claude-code-review:(?<sha>[0-9a-f]{40}) -->").sha' \
            | tail -n 1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Last reviewed commit: ${sha:-none}"

      - name: Work out what to review
        id: scope
        env:
          LAST_REVIEWED: ${{ steps.last.outputs.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "origin/$BASE_REF" "$HEAD")
          git diff --name-only "$merge_base" "$HEAD" | sort > "$RUNNER_TEMP/pr-files.txt"

          # Later reviews cover only the commits since the last reported one, as long as that
          # commit is still in the branch's history. With no earlier report, or after a force-push
          # rewrote history past it, the whole pull request is reviewed.
          if [ -n "$LAST_REVIEWED" ] \
            && git cat-file -e "$LAST_REVIEWED^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$LAST_REVIEWED" "$HEAD"; then
            mode=push
            from=$LAST_REVIEWED
            # Only files the pull request itself changes: a push that merges the base branch in
            # would otherwise hand the base branch's own changes to the review.
            git diff --name-only "$LAST_REVIEWED" "$HEAD" | sort | comm -12 - "$RUNNER_TEMP/pr-files.txt" \
              > "$RUNNER_TEMP/review-files.txt"
          else
            mode=full
            from=$merge_base
            cp "$RUNNER_TEMP/pr-files.txt" "$RUNNER_TEMP/review-files.txt"
          fi

          {
            echo "mode=$mode"
            echo "from=$from"
            echo "count=$(wc -l < "$RUNNER_TEMP/review-files.txt" | tr -d ' ')"
            echo "files<<EOF"
            cat "$RUNNER_TEMP/review-files.txt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing $mode: $from..$HEAD, $(wc -l < "$RUNNER_TEMP/review-files.txt") file(s)"
          cat "$RUNNER_TEMP/review-files.txt"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The prompt is written out here rather than using the code-review plugin, whose command
          # cannot be scoped: it always reviews the whole pull request through `gh pr diff`, stops
          # when Claude has commented before, and checks CLAUDE.md files this repository does not
          # have — its conventions live in AGENTS.md.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW MODE: ${{ steps.scope.outputs.mode }}
            DIFF RANGE: ${{ steps.scope.outputs.from }}..${{ github.event.pull_request.head.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            FILES IN SCOPE (${{ steps.scope.outputs.count }}):
            ${{ steps.scope.outputs.files }}

            Review this pull request. The head commit is checked out in the working directory
            with full history. Do the whole review yourself in this session: there are no
            subagents or background tasks available, and this run ends as soon as you stop, so
            nothing can be left running to finish later.

            Scope. Review only the changes in DIFF RANGE, restricted to FILES IN SCOPE:
            `git diff DIFF_RANGE -- <files>`, and `git log DIFF_RANGE` for the commits. When
            REVIEW MODE is `push`, an earlier review already covered the pull request up to the
            start of the range; do not re-review or re-report anything outside the range. You may
            read other files for context, but every finding must be about a line the range
            changed. Read the PR title and description with `gh pr view` for the author's intent.

            What to flag. Only high-signal problems you have verified: code that will fail to
            build, logic that is wrong regardless of input, a panic, hang, or stack overflow
            reachable from user input, a test that cannot fail, or a clear violation of a rule in
            AGENTS.md or docs/architecture.md that you can quote. Read AGENTS.md first. Do not flag
            style, naming, subjective improvements, pre-existing issues, or anything the linters
            (rustfmt, clippy) catch. Before reporting a finding, re-check it against the code; if
            you are not certain it is real, leave it out.

            Reporting. You must finish by posting exactly one top-level comment with
            `gh pr comment`, whether or not you found anything. Its first line must be the HTML
            comment `<!-- claude-code-review:HEAD_SHA -->` with HEAD SHA substituted, followed by:

            ## Code review

            A one-line scope: "Reviewed the whole pull request" in full mode, or "Reviewed the
            changes since the last review, DIFF_RANGE (N commits, M files)" in push mode, using the short SHAs. Then either a
            numbered list of findings, each with a one-sentence description and a link to the line
            in the form https://github.com/REPO/blob/HEAD_SHA/path#L10-L15, or the line "No issues
            found." Additionally post each finding as an inline comment with
            `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`). If FILES IN
            SCOPE is empty, post the report saying nothing in the pull request changed since the last review.
          # Subagents are refused, not merely discouraged. This run is headless, so it ends the
          # moment the main agent ends its turn; newer Claude Code versions start subagents in the
          # background, and a review that hands its work to one ends before any of it comes back.
          # That is what silenced the code-review plugin from Claude Code 2.1.273 on.
          claude_args: >-
            --allowedTools
            "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Agent,Task,Skill"
          # A run that decides something unexpected still leaves its reasoning in the run summary.
          display_report: "true"

      # The prompt requires a report on every run, and this holds it to that: a review that ends
      # without posting one fails here, so silence is a red check instead of a green one. It is
      # skipped only when Claude never started — the one expected case is a pull request that
      # changes this workflow, which the action refuses to run until the change is on main, and
      # says so in a warning on the run.
      - name: Check the review was reported
        if: steps.claude-review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- claude-code-review:${{ github.event.pull_request.head.sha }} -->"
        run: |
          set -euo pipefail
          found=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq "[.[] | select(.body | startswith(env.MARKER))] | length" | awk '{s+=$1} END {print s+0}')
          if [ "$found" -eq 0 ]; then
            echo "::error::The review posted no report for ${{ github.event.pull_request.head.sha }}."
            exit 1
          fi
          echo "Found $found report(s) for this head."

      # The full transcript of a run that failed, for working out why without leaving
      # `show_full_output` on in this public repository's logs. Kept briefly.
      - name: Upload the transcript of a failed review
        if: failure() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-transcript
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 3
