name: CI

# Apple Silicon, because the code generator's target and the differential oracle both assume macOS
# on ARM64. There is no meaningful way to run this suite anywhere else.
#
# `push` is limited to main so that a branch with an open pull request is not checked twice. An
# unfiltered `push` plus `pull_request` runs every job once for each event, against the same commit,
# which doubles the wall-clock and the runner minutes and reports each result twice on the pull
# request. Between the two, `pull_request` is the one worth keeping for branches: it is what the
# merge is gated on. `push` still covers main, so a merge or a direct commit there is checked.
#
# The cost is that a branch with no pull request open is not built. That is the intended trade:
# opening the pull request is what asks for the check.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run before it on the same ref; there is nothing to learn from finishing
# a run against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    name: Toolchain preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The build script shells out to clang to compile the runtime shim, and Phase 4's driver will
      # shell out to it to assemble and link. Asserting it up front turns a missing toolchain into
      # one clear failure here rather than a confusing linker error inside another job.
      - name: Assert the C toolchain resolves
        run: |
          clang --version
          xcrun --show-sdk-path

      - name: Assert the pinned Rust toolchain installs
        run: |
          rustup show
          cargo --version

  fmt:
    name: cargo fmt
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: macos-14
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: macos-14
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  docs:
    name: docs
    runs-on: macos-14
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5

      # Runs the same script a contributor runs, so what CI checks and what can be reproduced
      # locally cannot drift. It fails on a broken internal link, a page missing from the nav, and
      # on a rustdoc link pointing at an item that no longer exists — the last of which
      # `#![deny(missing_docs)]` cannot catch, since the doc comment is present, only stale.
      - name: Build the prose site and the API reference
        run: ./scripts/build-docs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

  # The acceptance suite, as its own check.
  #
  # `cargo test` above already runs it, so this is a second run of the same thing. That is the
  # trade, made deliberately: the project's stated definition of done is that every program in the
  # corpus behaves identically under this compiler and under clang, and a definition of done that
  # can only be read by opening another job's log and scrolling is one nobody reads. Twenty-five
  # seconds of runner time buys a line on the pull request that says so directly.
  differential:
    name: differential
    runs-on: macos-14
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compare every corpus program against clang -O0
        run: cargo test --test differential

# The long runs — fuzzing and a larger generated corpus — are in `nightly.yml`. They are measured in
# minutes per target rather than seconds, and they need a nightly toolchain, so they are on a
# schedule rather than on every push.
